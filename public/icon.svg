<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a11cb"/>
      <stop offset="100%" stop-color="#2575fc"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#purpleGrad)"/>
  
  <!-- Subtle Internal Grid Pattern -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Phone Outline -->
  <g filter="url(#shadow)">
    <rect x="156" y="86" width="200" height="340" rx="36" fill="#0f172a" stroke="rgba(255,255,255,0.2)" stroke-width="6"/>
    <!-- Phone Screen -->
    <rect x="170" y="112" width="172" height="288" rx="20" fill="#1e1b4b"/>
    <!-- Screen Notch/Island -->
    <rect x="226" y="96" width="60" height="12" rx="6" fill="#334155"/>
    <!-- Home Bar -->
    <rect x="220" y="384" width="72" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- Wrench & Gear Diagnostic Badge -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Glowing background disc -->
    <circle cx="0" cy="0" r="64" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="56" fill="#581c87"/>

    <!-- Crossed Tools / Wrench -->
    <path d="M-18,-24 C-28,-14 -28,4 -16,16 L18,50 C22,54 28,54 32,50 C36,46 36,40 32,36 L-2,2 C10,14 28,14 38,4 C44,-2 46,-10 44,-16 L30,-2 L24,-8 L38,-22 C32,-24 24,-22 18,-16 C10,-8 -6,-8 -14,-16 L-10,-20 C-14,-24 -24,-24 -28,-20 Z" fill="#fbbf24"/>
    
    <!-- Fix Sparkle -->
    <polygon points="18,-18 22,-28 26,-18 36,-14 26,-10 22,0 18,-10 8,-14" fill="#ffffff"/>
  </g>

  <!-- Text / Wordmark in safe zone -->
  <text x="256" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4">MAKRAN FIX</text>
</svg>
